function syncHeaderHeight(){
  const header = document.querySelector('header');
  if (!header) return;
  const h = Math.ceil(header.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('load', syncHeaderHeight);
window.addEventListener('resize', syncHeaderHeight);

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const empty = document.getElementById('empty');
const tagsBar = document.getElementById('tags');

let selectedTag = '';
const PAGE_SIZE = 4;
let filtered = [];
let cursor = 0;
let sentinel = null;
let io = null;
const BROWSE_STATE_PREFIX = 'catalogueBrowseState:';

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

function browseStateKey(){
  return BROWSE_STATE_PREFIX + location.pathname + location.search;
}

function saveBrowseState(){
  try {
    sessionStorage.setItem(browseStateKey(), JSON.stringify({
      scrollY: window.scrollY || window.pageYOffset || 0,
      cursor: cursor,
      tag: selectedTag || '',
      q: q && q.value ? String(q.value) : ''
    }));
  } catch (e) {}
}

function readBrowseState(){
  try {
    const raw = sessionStorage.getItem(browseStateKey());
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

// ✅ 不用 replaceAll，兼容旧 WebView，避免报错导致脚本中断
function escapeHtml(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function imgUrl(fn){ return fn ? ('图片夹/' + encodeURIComponent(fn)) : ''; }
function thumbUrl(fn){ return fn ? ('thumb/' + encodeURIComponent(fn)) : ''; }

function buildQS() {
  const params = new URLSearchParams();
  const t = (selectedTag || '').trim();
  const qq = (q && q.value ? String(q.value).trim() : '');
  if (t) params.set('tag', t);   // 不要手动 encodeURIComponent
  if (qq) params.set('q', qq);   // 不要手动 encodeURIComponent
  const s = params.toString();   // 自动把中文编码成 %E5...
  return s ? ('?' + s) : '';
}

function updateUrl() {
  const qs = buildQS();
  history.replaceState(null, '', qs ? (location.pathname + qs) : location.pathname);
}

function initFromUrl() {
  const params = new URLSearchParams(location.search);

  // URLSearchParams.get() 读出来通常已经是“解码后的中文”
  // 但如果你旧版本曾经手动 encode 过，可能会出现残留的 %E5...，这里做一次兜底解码
  const safeDecode = (s) => {
    try { return decodeURIComponent(s); } catch { return s; }
  };

  const tRaw = (params.get('tag') || '').trim();
  const qRaw = (params.get('q') || '').trim();

  const t = safeDecode(tRaw);
  const qq = safeDecode(qRaw);

  if (t) selectedTag = t;
  if (qq && q) q.value = qq;
}

function card(it, absoluteIndex) {
  const el = document.createElement('div');
  el.className = 'card';
  const cover = it.cover_thumb ? thumbUrl(it.cover_thumb) : (it.cover ? imgUrl(it.cover) : '');
  const href = `p/${escapeHtml(it.pid)}.html${buildQS()}`;
  el.innerHTML = `
    <a class="img" href="${href}">
      ${cover ? `<img loading="${absoluteIndex < PAGE_SIZE ? 'eager' : 'lazy'}" ${absoluteIndex === 0 ? 'fetchpriority="high"' : ''} decoding="async" src="${cover}" alt="">` : ''}
    </a>
    <div class="meta">
      <div class="t">${escapeHtml(it.title)}</div>
      <div class="row"><div class="p">${it.price_text ? escapeHtml(it.price_text) : ''}</div></div>
      <div class="pid">ID: ${escapeHtml(it.pid)}</div>
      </div>`;
  const link = el.querySelector('a.img');
  if (link) link.addEventListener('click', saveBrowseState);
  return el;
}

function ensureSentinel(){
  if (sentinel) return sentinel;
  sentinel = document.createElement('div');
  sentinel.style.height = '1px';
  grid.parentNode.appendChild(sentinel);
  return sentinel;
}
function disconnectIO(){ if (io){ io.disconnect(); io=null; } }

function connectIO(){
  disconnectIO();
  if (!('IntersectionObserver' in window)) { appendNextPage(); appendNextPage(); return; }
  const s = ensureSentinel();
  io = new IntersectionObserver((entries)=>{
    for(const e of entries){ if(e.isIntersecting) appendNextPage(); }
  }, { root:null, rootMargin:'200px 0px', threshold:0.01 });
  io.observe(s);
}

function renderReset(list){
  grid.innerHTML = '';
  filtered = list || [];
  cursor = 0;
  empty.style.display = filtered.length ? 'none' : 'block';
  appendNextPage();
  connectIO();
}

function appendNextPage(){
  if (!filtered.length || cursor >= filtered.length) return;
  const end = Math.min(cursor + PAGE_SIZE, filtered.length);
  const frag = document.createDocumentFragment();
  for (let i=cursor;i<end;i++) frag.appendChild(card(filtered[i], i));
  grid.appendChild(frag);
  cursor = end;
  if (cursor >= filtered.length) disconnectIO();
}

function restoreBrowsePosition(state){
  if (!state) return;
  const targetCursor = Math.max(PAGE_SIZE, Number(state.cursor) || PAGE_SIZE);
  while (cursor < targetCursor && cursor < filtered.length) appendNextPage();
  const y = Math.max(0, Number(state.scrollY) || 0);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.scrollTo(0, y);
      setTimeout(()=>window.scrollTo(0, y), 80);
    });
  });
}

for (const it of ITEMS){
  it._tagSet = new Set(it.tags || []);
  it._hay = (`${it.pid} ${(it.search || it.title || '')}`).toLowerCase();
}

function filter(){
  const s = (q.value || '').trim().toLowerCase();
  const parts = s ? s.split(/\s+/).filter(Boolean) : [];
  const out = ITEMS.filter(it=>{
    if (selectedTag && !it._tagSet.has(selectedTag)) return false;
    if (parts.length){
      const hay = it._hay;
      for(const p of parts){ if(!hay.includes(p)) return false; }
    }
    return true;
  });
  renderReset(out);
}

function syncTagActive(){
  const btns = tagsBar.querySelectorAll('.tagbtn');
  btns.forEach((b, idx)=>{
    if (idx===0){ b.classList.toggle('active', !selectedTag); return; }
    b.classList.toggle('active', selectedTag===b.dataset.tag);
  });
}

function buildTags(){
  tagsBar.innerHTML = '';
  const allBtn = document.createElement('div');
  allBtn.className='tagbtn';
  allBtn.textContent = `全部 (${ITEMS.length})`;
  allBtn.onclick=()=>{
    selectedTag='';
    syncTagActive();
    filter();
    updateUrl();
  };
  tagsBar.appendChild(allBtn);

  TAGS.forEach(t=>{
    const b = document.createElement('div');
    b.className='tagbtn';
    b.dataset.tag=t.name;
    b.textContent = `${t.name} (${t.count})`;
    b.onclick=()=>{
      selectedTag = (selectedTag===t.name)?'':t.name;
      syncTagActive();
      filter();
      updateUrl();
    };
    tagsBar.appendChild(b);
  });
  syncTagActive();
}

let tmr=null;
q.addEventListener('input', ()=>{
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    filter();
    updateUrl();
  }, 120);
});

// 启动：在售数据已由 Python 根据 Excel 过滤完成
buildTags();
initFromUrl();
const savedBrowseState = readBrowseState();
if (savedBrowseState) {
  selectedTag = savedBrowseState.tag || selectedTag;
  if (q && typeof savedBrowseState.q === 'string') q.value = savedBrowseState.q;
}
syncTagActive();
filter();
updateUrl();
restoreBrowsePosition(savedBrowseState);

</script>

</body>
</html>
