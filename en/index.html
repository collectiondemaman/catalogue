<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Available Catalogue</title>
<style>
  :root { --bg:#fff; --text:#111; --muted:#666; --border:#eee; --radius:16px; --header-h:56px; }
  *{ box-sizing:border-box; } html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; }
  a{ color:inherit; text-decoration:none; }
  header{ position:sticky; top:0; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); z-index:10; }
  .bar{ max-width:980px; margin:0 auto; padding:10px 12px; display:flex; gap:10px; align-items:center; }
  .brand{ font-weight:900; letter-spacing:.2px; font-size:16px; } .hint{ color:var(--muted); font-size:12px; }
  input[type="search"]{ flex:1; border:1px solid var(--border); border-radius:999px; padding:10px 12px; font-size:14px; outline:none; }
  .pill{ border:1px solid var(--border); padding:6px 10px; border-radius:999px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .wrap{ max-width:980px; margin:0 auto; padding:12px 12px 56px; }

  .grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .grid .card{ width:calc((100% - 10px) / 2); }
  @media (max-width:320px){ .grid .card{ width:100%; } }

  @supports (display:grid){
    .grid{ display:grid; gap:10px; margin-top:12px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid .card{ width:auto; }
    @media (max-width:320px){ .grid{ grid-template-columns:1fr; } }
    @media (min-width:768px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); } }
  }

  .card{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:#fff; box-shadow:0 8px 24px rgba(0,0,0,.04); }
  .img{ display:block; aspect-ratio:4/3; background:#f3f3f3; }
  .img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .meta{ padding:10px 10px 12px; }
  .t{ font-size:14px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.7em; white-space:pre-wrap; }
  .row{ display:flex; justify-content:space-between; gap:10px; margin-top:8px; align-items:baseline; }
  .p{ font-weight:900; color:#ff6a00; }
  .pid{ color:#aaa; font-size:11px; margin-top:6px; text-align:right; letter-spacing:.3px; }

  .tags{ display:flex; gap:8px; overflow:auto; padding-bottom:6px; margin-top:10px;
    position:sticky; top:var(--header-h); background:rgba(255,255,255,.95); backdrop-filter:blur(8px); z-index:9; padding-top:6px; }
  @media (max-width:768px){ .tags{ flex-wrap:wrap; overflow:visible; padding-bottom:10px; } }
  .tagbtn{ border:1px solid var(--border); border-radius:999px; padding:7px 10px; font-size:12px; color:var(--muted); white-space:nowrap; background:#fff; cursor:pointer; user-select:none; }
  .tagbtn.active{ color:#111; border-color:#ccc; font-weight:800; }

  .allimgs{ margin-top:12px; } .oneimg{ margin:10px 0; }
  .oneimg img{ width:100%; max-width:980px; height:auto; display:block; }
  .desc{ margin-top:18px; font-size:14px; line-height:1.7; max-width:820px; }
  .desc h2{ margin:22px 0 8px; font-size:15px; line-height:1.3; letter-spacing:.2px; }
  .desc h2:first-child{ margin-top:0; }
  .desc p{ margin:0 0 12px; }
  .desc ul{ margin:0 0 14px; padding-left:20px; }
  .desc li{ margin:4px 0; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div style="min-width:86px;">
      <div class="brand">Collection de Maman</div>
      <div class="hint">French Vintage &amp; Antiques</div>
    </div>
    <input id="q" type="search" placeholder="Search by maker, item or keyword" />
  </div>
</header>

<div class="wrap">
  <div class="tags" id="tags"></div>
  <div class="grid" id="grid"></div>
  <div class="hint" id="empty" style="display:none; text-align:center; margin-top:22px;">No matching available items</div>
</div>

<script>
const ITEMS = [{"pid": "1066210668733", "title": "W.H. Grindley Country Style Vintage Plate Pendant Lamp, 25.5 cm", "search": "Description Handmade pendant lamp converted from a vintage W.H. Grindley & Co. Ltd. Country Style plate (marked \"Hand Engraving\"), Staffordshire, England. The plate bears a classic English country landscape; when lit the warm glow softens the motif, offering a", "price_text": "Price upon request", "cover": "1066210668733-01.jpg", "cover_thumb": "1066210668733-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1065290861658", "title": "Vintage Sarreguemines Ceramic Plate Pendant Light (Converted)", "search": "Description This pendant light is made from a vintage French Sarreguemines ceramic plate, thoughtfully converted into a functional decorative fixture that preserves the plate’s original character and charm. It suits French, country, cream, and vintage interior", "price_text": "Price upon request", "cover": "1065290861658-01.jpg", "cover_thumb": "1065290861658-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1064435358949", "title": "Vintage French Sarreguemines Soup Tureen with Woven Conical Lid, Ø26.5 cm", "search": "Description A vintage Sarreguemines soup tureen from France, featuring a woven, conical lid and classic French country character. Clean, simple form with understated decoration suited to a rustic table setting. Dimensions - Diameter: 26.5 cm - Height: 13 cm Co", "price_text": "Price upon request", "cover": "1064435358949-01.jpg", "cover_thumb": "1064435358949-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1066401012524", "title": "Vintage French Caramel Brown Glazed Large Salad Bowl", "search": "Description Vintage French ceramic bowl in a warm caramel-brown glaze. The retro, muted tones suit Scandinavian, country, or Japanese natural-wood interiors and work well as a fruit bowl, salad bowl, soup bowl, or styling prop. Base bears the original factory ", "price_text": "Price upon request", "cover": "1066401012524-01.jpg", "cover_thumb": "1066401012524-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1065465609222", "title": "Vintage French Digoin Sarreguemines Art Deco Sugar Jar with Original Lid", "search": "Description A classic Art Deco octagonal sugar jar featuring a geometric-line handle and hand-painted floral decoration. Elegant in form, it combines decorative appeal with everyday practicality. Dimensions - Height with lid: 15 cm - Height without lid: 11.5 c", "price_text": "Price upon request", "cover": "1065465609222-01.jpg", "cover_thumb": "1065465609222-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1064653434075", "title": "Wabi-Sabi Vintage: African Kuba Cloth with Rustic Tile-Top Table", "search": "Wabi-sabi vintage pairing: a vintage African Kuba cloth combined with a rustic tile-top country table — a striking addition for vintage interiors. Due to the rarity and uniqueness of vintage and antique items, please enquire about availability before ordering.", "price_text": "Price upon request", "cover": "1064653434075-01.jpg", "cover_thumb": "1064653434075-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1065666205802", "title": "Kuba Cloth Wall Panel, Handwoven Raffia, 232 x 65 cm", "search": "Kuba cloth wall panel, 232 x 65 cm. Condition: as pictured. In 20th‑century Paris, artists such as Matisse and Picasso admired Kuba textiles—Matisse for their color and composition, Picasso for their abstract rhythmic geometry that fed into Cubist thought. Eac", "price_text": "Price upon request", "cover": "1065666205802-01.jpg", "cover_thumb": "1065666205802-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1066620604330", "title": "French Vintage Milk Glass Adjustable-Height Pendant Light — Shade Ø 25 cm", "search": "French vintage milk glass adjustable-height pendant light. Shade diameter approximately 25 cm. Good overall condition: no chips, no cracks. Due to the unique nature of vintage items, please confirm availability before purchase. Sold as-is; vintage items are fi", "price_text": "Price upon request", "cover": "1066620604330-01.jpg", "cover_thumb": "1066620604330-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1063842951499", "title": "French Vintage Milk Glass Adjustable Pendant Light, Diameter 25 cm", "search": "French vintage milk glass adjustable pendant light. Diameter: 25 cm. Good overall condition — no chips, no cracks. Due to the rarity of vintage items, please inquire about availability before ordering. Carefully packed; damage during transit will be compensate", "price_text": "Price upon request", "cover": "1063842951499-01.jpg", "cover_thumb": "1063842951499-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1063843059634", "title": "French Vintage Hand-Painted Ceramic Wall Clock, 25.5 × 20.5 cm", "search": "Description A French vintage hand-painted ceramic wall clock with a simple, decorative motif. Compact and suitable for display in a kitchen or small room; the movement runs accurately. Dimensions - 25.5 × 20.5 cm Condition - Good overall condition. - Keeps acc", "price_text": "Price upon request", "cover": "1063843059634-01.jpg", "cover_thumb": "1063843059634-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1062525651177", "title": "French ST.AMAND 'Jardin' Vintage Ceramic Salad-Bowl Pendant Lamp, Blue-and-White", "search": "Description A French ST.AMAND Jardin series vintage ceramic salad bowl professionally converted into a pendant lamp. Features the classic blue-and-white floral pattern and strong French country character — well suited to a kitchen island, dining area, café, en", "price_text": "Price upon request", "cover": "1062525651177-01.jpg", "cover_thumb": "1062525651177-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1064353205307", "title": "Vintage B&C Monttereau Lidded Sauce Boat with Original Tray — Haviland & Cie Paris, Relief Porcelain", "search": "Description Elegant vintage French lidded sauce boat with its original tray, marked B&C Monttereau and Haviland & Cie Paris. The piece features a fruit-shaped finial, delicate relief decoration and a hand-painted floral motif, reflecting classic French tablewa", "price_text": "Price upon request", "cover": "1064353205307-01.jpg", "cover_thumb": "1064353205307-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1064352477900", "title": "Cauldon BWM Vintage Blue-and-White Bird Sauce Boat with Underplate — English Bone China", "search": "Description Elegant vintage sauce boat by Cauldon BWM in English bone china, offered with its original underplate. Decorated in a classic blue-and-white small bird motif; the form is graceful and suited to cottage or country-style interiors. Practical for serv", "price_text": "Price upon request", "cover": "1064352477900-01.jpg", "cover_thumb": "1064352477900-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1064588837799", "title": "Vintage French Original Watercolor of Notre-Dame, Framed, 36×43 cm", "search": "Description An original vintage French watercolor view of Notre-Dame Cathedral in Paris. Rendered with pen outlining and watercolor washes, the work emphasizes architectural detail and a soft, atmospheric palette typical of Parisian cityscapes. The painting is", "price_text": "Price upon request", "cover": "1064588837799-01.jpg", "cover_thumb": "1064588837799-01.jpg", "tags": ["Vintage Objects"]}, {"pid": "1063048603284", "title": "Cream-Colored Small Floral Flat Plate, 24 cm (Vintage)", "search": "Description A cream-colored flat plate decorated with a small floral pattern. Vintage piece, suitable for display or light use. Dimensions - Diameter: 24 cm Condition - Good overall condition. - Shows signs of use. - No crazing. Additional Details - Single vin", "price_text": "Price upon request", "cover": "1063048603284-01.jpg", "cover_thumb": "1063048603284-01.jpg", "tags": ["Vintage Objects"]}];
const TAGS = [{"name": "Furniture", "count": 0}, {"name": "Washstands", "count": 0}, {"name": "Sinks", "count": 0}, {"name": "Lighting", "count": 0}, {"name": "Art & Mirrors", "count": 0}, {"name": "Paper Art", "count": 0}, {"name": "Vintage Objects", "count": 15}];

// ✅ 运行时读取 sell.txt（手机提交后刷新网页即可生效）
async function loadSoldIds(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 2000);
    const res = await fetch('sell.txt?v=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if(!res.ok) return new Set();
    let text = await res.text();
    text = text.replace(/^\uFEFF/, ''); // 去 BOM
    const ids = new Set();
    text.split(/\r?\n/).forEach(line=>{
      const s = (line || '').trim();
      if(!s) return;
      if(s.startsWith('#')) return;
      ids.add(s);
    });
    console.log('[sell.txt] ids=', ids.size, 'sample=', Array.from(ids).slice(0,5));
    return ids;
  }catch(e){
    console.log('[sell.txt] fetch failed', e);
    return new Set();
  }
}

function syncHeaderHeight(){
  const header = document.querySelector('header');
  if (!header) return;
  const h = Math.ceil(header.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('load', syncHeaderHeight);
window.addEventListener('resize', syncHeaderHeight);

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const empty = document.getElementById('empty');
const tagsBar = document.getElementById('tags');

let selectedTag = '';
const PAGE_SIZE = 4;
let filtered = [];
let cursor = 0;
let sentinel = null;
let io = null;

// ✅ 不用 replaceAll，兼容旧 WebView，避免报错导致脚本中断
function escapeHtml(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function imgUrl(fn){ return fn ? ('/图片夹/' + encodeURIComponent(fn)) : ''; }
function thumbUrl(fn){ return fn ? ('/thumb/' + encodeURIComponent(fn)) : ''; }

function buildQS() {
  const params = new URLSearchParams();
  const t = (selectedTag || '').trim();
  const qq = (q && q.value ? String(q.value).trim() : '');
  if (t) params.set('tag', t);   // 不要手动 encodeURIComponent
  if (qq) params.set('q', qq);   // 不要手动 encodeURIComponent
  const s = params.toString();   // 自动把中文编码成 %E5...
  return s ? ('?' + s) : '';
}

function updateUrl() {
  const qs = buildQS();
  history.replaceState(null, '', qs ? (location.pathname + qs) : location.pathname);
}

function initFromUrl() {
  const params = new URLSearchParams(location.search);

  // URLSearchParams.get() 读出来通常已经是“解码后的中文”
  // 但如果你旧版本曾经手动 encode 过，可能会出现残留的 %E5...，这里做一次兜底解码
  const safeDecode = (s) => {
    try { return decodeURIComponent(s); } catch { return s; }
  };

  const tRaw = (params.get('tag') || '').trim();
  const qRaw = (params.get('q') || '').trim();

  const t = safeDecode(tRaw);
  const qq = safeDecode(qRaw);

  if (t) selectedTag = t;
  if (qq && q) q.value = qq;
}

function card(it) {
  const el = document.createElement('div');
  el.className = 'card';
  const cover = it.cover_thumb ? thumbUrl(it.cover_thumb) : (it.cover ? imgUrl(it.cover) : '');
  const href = `p/${escapeHtml(it.pid)}.html${buildQS()}`;
  el.innerHTML = `
    <a class="img" href="${href}">
      ${cover ? `<img loading="lazy" decoding="async" src="${cover}" alt="">` : ''}
    </a>
    <div class="meta">
      <div class="t">${escapeHtml(it.title)}</div>
      <div class="row"><div class="p">${it.price_text ? escapeHtml(it.price_text) : ''}</div></div>
      <div class="pid">ID: ${escapeHtml(it.pid)}</div>
    </div>`;
  return el;
}

function ensureSentinel(){
  if (sentinel) return sentinel;
  sentinel = document.createElement('div');
  sentinel.style.height = '1px';
  grid.parentNode.appendChild(sentinel);
  return sentinel;
}
function disconnectIO(){ if (io){ io.disconnect(); io=null; } }

function connectIO(){
  disconnectIO();
  if (!('IntersectionObserver' in window)) { appendNextPage(); appendNextPage(); return; }
  const s = ensureSentinel();
  io = new IntersectionObserver((entries)=>{
    for(const e of entries){ if(e.isIntersecting) appendNextPage(); }
  }, { root:null, rootMargin:'200px 0px', threshold:0.01 });
  io.observe(s);
}

function renderReset(list){
  grid.innerHTML = '';
  filtered = list || [];
  cursor = 0;
  empty.style.display = filtered.length ? 'none' : 'block';
  appendNextPage();
  connectIO();
}

function appendNextPage(){
  if (!filtered.length || cursor >= filtered.length) return;
  const end = Math.min(cursor + PAGE_SIZE, filtered.length);
  const frag = document.createDocumentFragment();
  for (let i=cursor;i<end;i++) frag.appendChild(card(filtered[i]));
  grid.appendChild(frag);
  cursor = end;
  if (cursor >= filtered.length) disconnectIO();
}

for (const it of ITEMS){
  it._tagSet = new Set(it.tags || []);
  it._hay = (`${it.pid} ${(it.search || it.title || '')}`).toLowerCase();
}

function filter(){
  const s = (q.value || '').trim().toLowerCase();
  const parts = s ? s.split(/\s+/).filter(Boolean) : [];
  const out = ITEMS.filter(it=>{
    if (selectedTag && !it._tagSet.has(selectedTag)) return false;
    if (parts.length){
      const hay = it._hay;
      for(const p of parts){ if(!hay.includes(p)) return false; }
    }
    return true;
  });
  renderReset(out);
}

function syncTagActive(){
  const btns = tagsBar.querySelectorAll('.tagbtn');
  btns.forEach((b, idx)=>{
    if (idx===0){ b.classList.toggle('active', !selectedTag); return; }
    b.classList.toggle('active', selectedTag===b.dataset.tag);
  });
}

function buildTags(){
  tagsBar.innerHTML = '';
  const allBtn = document.createElement('div');
  allBtn.className='tagbtn';
  allBtn.textContent = `All (${ITEMS.length})`;
  allBtn.onclick=()=>{
    selectedTag='';
    syncTagActive();
    filter();
    updateUrl();
  };
  tagsBar.appendChild(allBtn);

  TAGS.forEach(t=>{
    const b = document.createElement('div');
    b.className='tagbtn';
    b.dataset.tag=t.name;
    b.textContent = `${t.name} (${t.count})`;
    b.onclick=()=>{
      selectedTag = (selectedTag===t.name)?'':t.name;
      syncTagActive();
      filter();
      updateUrl();
    };
    tagsBar.appendChild(b);
  });
  syncTagActive();
}

let tmr=null;
q.addEventListener('input', ()=>{
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    filter();
    updateUrl();
  }, 120);
});

// ✅ 启动：先渲染（不等待 sell.txt）
buildTags();
initFromUrl();
syncTagActive();
filter();
updateUrl();

// ✅ 后台加载 sell.txt：成功后再二次过滤 + 刷新（不阻塞首屏）
(async ()=>{
  const soldIds = await loadSoldIds();
  if (!soldIds || soldIds.size === 0) return;

  const kept = ITEMS.filter(it => !soldIds.has(String(it.pid)));
  if (kept.length === ITEMS.length) return;

  ITEMS.length = 0;
  kept.forEach(x => ITEMS.push(x));

  console.log('[sell.txt] filtered. kept=', kept.length, 'soldIds=', soldIds.size);

  // 过滤后刷新一次
  buildTags();
  syncTagActive();
  filter();
  updateUrl();
})();
</script>

</body>
</html>
