<style>
  :root { --bg:#fff; --text:#111; --muted:#666; --border:#eee; --radius:16px; --header-h:56px; }
  *{ box-sizing:border-box; } html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--text);

  .trust-item{ padding:20px 14px; text-align:center; border-right:1px solid var(--border); }
  .trust-item:last-child{ border-right:0; }
  .trust-icon{ font-size:24px; margin-bottom:8px; }
  .trust-title{ font-weight:750; font-size:13px; }
  .trust-text{ margin-top:5px; color:#777; font-size:11px; line-height:1.45; }

  .mobile-enquiry-bar{ display:none; }

    .thumb-btn{ flex:0 0 60px; width:60px; height:60px; }

    .product-title{ font-size:20px; margin-bottom:8px; }

    .trust-strip{ grid-template-columns:repeat(2,1fr); }
    .trust-item:nth-child(2){ border-right:0; }

    }
  }
</style>

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const empty = document.getElementById('empty');

// ✅ 不用 replaceAll，兼容旧 WebView
function escapeHtml(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function imgUrl(fn){ return fn ? ('图片夹/' + encodeURIComponent(fn)) : ''; }

function card(it){
  const el = document.createElement('div');
  el.className='card';
  const cover = it.cover ? imgUrl(it.cover) : '';
  const imgs = (it.imgs||[]).map(fn=>`<div class="oneimg"><img loading="lazy" decoding="async" src="${imgUrl(fn)}" alt=""></div>`).join('');
  el.innerHTML = `
    <a class="img" href="javascript:void(0)">${cover ? `<img loading="lazy" decoding="async" src="${cover}" alt="">` : ''}</a>
    <div class="meta">
      <div class="t">${escapeHtml(it.title)}</div>
      <div class="row"><div class="p">${it.price_text ? escapeHtml(it.price_text) : ''}</div></div>
      <div class="pid">ID: ${escapeHtml(it.pid)}</div>
      <details>
        <summary>展开文字与全部图片</summary>
        <div style="margin-top:10px; white-space:pre-wrap; font-size:13px; line-height:1.7;">${escapeHtml(it.raw || '')}</div>
        <div class="allimgs" style="margin-top:10px;">${imgs || '<div class="hint">（无图片）</div>'}</div>
      </details>
    </div>`;
  return el;
}

function render(list){
  grid.innerHTML='';
  list.forEach(it=>grid.appendChild(card(it)));
  empty.style.display = list.length ? 'none' : 'block';
}

function filter(){
  const s=(q.value||'').trim().toLowerCase();
  const parts=s ? s.split(/\s+/).filter(Boolean) : [];
  const out = ITEMS.filter(it=>{
    if(!parts.length) return true;
    const hay=(it.raw||'').toLowerCase();
    for(const p of parts){ if(!hay.includes(p)) return false; }
    return true;
  });
  render(out);
}

q.addEventListener('input', filter);
filter();
</script>
