<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>帮我找货</title>
<style>
  :root { --bg:#fff; --text:#111; --muted:#666; --border:#eee; --radius:16px; --header-h:56px; }
  *{ box-sizing:border-box; } html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; }
  a{ color:inherit; text-decoration:none; }
  header{ position:sticky; top:0; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); z-index:10; }
  .bar{ max-width:980px; margin:0 auto; padding:10px 12px; display:flex; gap:10px; align-items:center; }
  .brand{ font-weight:900; letter-spacing:.2px; font-size:16px; } .hint{ color:var(--muted); font-size:12px; }
  input[type="search"]{ flex:1; border:1px solid var(--border); border-radius:999px; padding:10px 12px; font-size:14px; outline:none; }
  .pill{ border:1px solid var(--border); padding:6px 10px; border-radius:999px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .wrap{ max-width:980px; margin:0 auto; padding:12px 12px 56px; }

  .grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .grid .card{ width:calc((100% - 10px) / 2); }
  @media (max-width:320px){ .grid .card{ width:100%; } }

  @supports (display:grid){
    .grid{ display:grid; gap:10px; margin-top:12px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid .card{ width:auto; }
    @media (max-width:320px){ .grid{ grid-template-columns:1fr; } }
    @media (min-width:768px){ .grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  }

  .card{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:#fff; box-shadow:0 8px 24px rgba(0,0,0,.04); }
  .img{ display:block; aspect-ratio:4/3; background:#f3f3f3; }
  .img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .meta{ padding:10px 10px 12px; }
  .t{ font-size:14px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.7em; white-space:pre-wrap; }
  .row{ display:flex; justify-content:space-between; gap:10px; margin-top:8px; align-items:baseline; }
  .p{ font-weight:900; color:#ff6a00; }
  .pid{ color:#aaa; font-size:11px; margin-top:6px; text-align:right; letter-spacing:.3px; }

  .category-panel{position:sticky;top:var(--header-h,80px);z-index:11;background:#fff;margin:12px 0; border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .category-panel summary{cursor:pointer;font-weight:600;}
  .category-panel .tags{position:static;flex-wrap:wrap;overflow:visible;max-height:55vh;overflow-y:auto;}
  .tags{ display:flex; gap:8px; overflow:auto; padding-bottom:6px; margin-top:10px;
    position:sticky; top:var(--header-h); background:rgba(255,255,255,.95); backdrop-filter:blur(8px); z-index:9; padding-top:6px; }
  @media (max-width:768px){ .tags{ flex-wrap:wrap; overflow:visible; padding-bottom:10px; } }
  .tagbtn{ border:1px solid var(--border); border-radius:999px; padding:7px 10px; font-size:12px; color:var(--muted); white-space:nowrap; background:#fff; cursor:pointer; user-select:none; }
  .tagbtn.active{ color:#111; border-color:#ccc; font-weight:800; }

  .allimgs{ margin-top:12px; } .oneimg{ margin:10px 0; }
  .oneimg img{ width:100%; max-width:980px; height:auto; display:block; }

  .product-layout{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr); gap:36px; align-items:start; }
  .gallery{ display:grid; grid-template-columns:76px minmax(0,1fr); gap:12px; position:sticky; top:76px; }
  .thumb-list{ display:flex; flex-direction:column; gap:10px; max-height:720px; overflow:auto; padding-right:2px; }
  .thumb-btn{ width:76px; height:76px; padding:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#f5f5f5; cursor:pointer; }
  .thumb-btn.active{ border-color:#111; box-shadow:0 0 0 1px #111; }
  .thumb-btn img{ width:100%; height:100%; object-fit:cover; display:block; }
  .main-photo{ min-height:520px; border-radius:14px; overflow:hidden; background:#f4f4f4; display:flex; align-items:center; justify-content:center; }
  .main-photo img{ width:100%; height:auto; max-height:760px; object-fit:contain; display:block; }
  .product-info{ min-width:0; }
  .product-title{ font-size:26px; line-height:1.35; font-weight:750; margin:0 0 12px; white-space:pre-wrap; }
  .price-large{ margin-top:12px; font-size:24px; font-weight:900; color:#ff6a00; }
  .desc{ margin-top:18px; white-space:pre-wrap; line-height:1.75; font-size:14.5px; }
  .trust-strip{ margin-top:36px; display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .trust-item{ padding:20px 14px; text-align:center; border-right:1px solid var(--border); }
  .trust-item:last-child{ border-right:0; }
  .trust-icon{ font-size:24px; margin-bottom:8px; }
  .trust-title{ font-weight:750; font-size:13px; }
  .trust-text{ margin-top:5px; color:#777; font-size:11px; line-height:1.45; }

  .mobile-enquiry-bar{ display:none; }

  @media (max-width:820px){
    body{ padding-bottom:82px; }
    .product-layout{ grid-template-columns:1fr; gap:16px; }
    .gallery{ position:static; grid-template-columns:1fr; }
    .thumb-list{ order:2; flex-direction:row; max-height:none; overflow:auto; }
    .thumb-btn{ flex:0 0 60px; width:60px; height:60px; }
    .main-photo{ min-height:0; max-height:58vh; border-radius:12px; }
    .main-photo img{ max-height:58vh; }
    .product-title{ font-size:20px; margin-bottom:8px; }
    .price-large{ font-size:22px; margin-top:8px; }
    .trust-strip{ grid-template-columns:repeat(2,1fr); }
    .trust-item:nth-child(2){ border-right:0; }
    .trust-item:nth-child(-n+2){ border-bottom:1px solid var(--border); }
    .mobile-enquiry-bar{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:100;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,.96); backdrop-filter:blur(12px);
      border-top:1px solid var(--border); box-shadow:0 -8px 24px rgba(0,0,0,.08);
    }
    .mobile-enquiry-btn{
      width:100%; min-height:50px; border:0; border-radius:12px;
      background:#111; color:#fff; font-size:15px; font-weight:800; cursor:pointer;
    }
  }
</style>

<meta name="robots" content="noindex,follow"></head>
<body>
<header class="sourcing-header"><div class="bar"><a href="/index.html">← 返回商品目录</a></div></header>
<main class="wrap sourcing"><h1>遇见你想找的中古好物</h1><p>上传参考图片，留下预算和微信号或微信昵称，我们会帮你淘心仪的宝贝</p>
<form id="source-form"><label>参考图片（必填，最多3张，合计不超过8MB）<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><div id="previews"></div>
<label>预算金额<input name="预算" type="number" min="1" step="0.01" required placeholder="例如 1000"></label>
<label>微信号或微信昵称<input name="微信号或微信昵称" maxlength="80" autocomplete="off" required placeholder="填写你的微信号或微信昵称"></label>
<label>备注（非必填）<textarea name="备注" maxlength="2000" rows="4" placeholder="尺寸、颜色、数量等偏好"></textarea></label>
<p class="hint">图片、预算和微信号或微信昵称将通过 FormSubmit 发送给布丁妈，仅用于找货联系。历史记录保存在当前浏览器，清理记录或换设备后无法恢复；历史中仅保存压缩后的图片缩略图。</p>

<button id="send" type="submit">提交</button><p id="result" role="status" aria-live="polite"></p></form>
<h2>我的提交历史</h2><p class="hint">仅为本机提交记录，不代表找货进度。</p><div id="source-history"></div><button id="clear-history" type="button">清除本机记录</button></main>
<style>.sourcing-link{display:none!important}header.sourcing-header .bar{padding-right:90px!important;min-height:54px;box-sizing:border-box;display:flex;align-items:center}header .bar a{white-space:nowrap}.history-thumbnails{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.history-thumbnails img{width:76px;height:76px;object-fit:cover;border-radius:8px}.sourcing{max-width:680px}.sourcing label{display:block;margin:18px 0}.sourcing input:not([type=checkbox]),.sourcing textarea,.sourcing select{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.sourcing button{padding:12px 18px;border:1px solid #ddd;border-radius:12px;cursor:pointer}.sourcing #send{background:#222;color:white;width:100%}#previews{display:flex;gap:8px;flex-wrap:wrap}#previews img{width:88px;height:88px;object-fit:cover;border-radius:10px}.source-record{padding:14px 0;border-bottom:1px solid #ddd;white-space:pre-wrap;overflow-wrap:anywhere}</style>
<script>
(()=>{'use strict';
const key='collectionDeMaman:sourcing:v1',form=document.getElementById('source-form'),photos=document.getElementById('photos'),result=document.getElementById('result'),send=document.getElementById('send');
let records=[],urls=[],busy=false;
try{const a=JSON.parse(localStorage.getItem(key)||'[]');records=Array.isArray(a)?a.slice(0,50):[];}catch(e){}
function render(){const host=document.getElementById('source-history');host.replaceChildren();if(!records.length){host.textContent='还没有提交记录。';return;}records.forEach(r=>{const el=document.createElement('div');el.className='source-record';el.textContent=[r.time,'编号：'+r.id,'预算：'+r.budget,'微信：'+r.wechat,'参考图片：'+r.images+'张',r.note||'',r.status,r.error?'原因：'+r.error:''].join('\n');if(Array.isArray(r.thumbnails)){const gallery=document.createElement('div');gallery.className='history-thumbnails';r.thumbnails.forEach(src=>{if(typeof src!=='string'||!src.startsWith('data:image/jpeg;base64,'))return;const img=document.createElement('img');img.src=src;img.alt='已提交的参考图片';gallery.append(img);});el.append(gallery);}host.append(el);});}
function save(){try{localStorage.setItem(key,JSON.stringify(records.slice(0,50)));return true;}catch(e){return false;}}
async function thumbnail(file){
 return new Promise(resolve=>{const img=new Image(),url=URL.createObjectURL(file);const finish=v=>{URL.revokeObjectURL(url);resolve(v);};img.onerror=()=>finish('');img.onload=()=>{try{const scale=Math.min(1,180/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);finish(canvas.toDataURL('image/jpeg',0.65));}catch(e){finish('');}};img.src=url;});
}
function filesError(){const a=Array.from(photos.files);if(!a.length)return '请上传参考图片。';if(a.length>3)return '最多上传3张图片。';if(a.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)))return '请使用 JPG、PNG 或 WebP 图片。';if(a.reduce((n,f)=>n+f.size,0)>8*1024*1024)return '图片合计不能超过8MB，请压缩后重试。';return '';}
photos.onchange=()=>{urls.forEach(URL.revokeObjectURL);urls=[];const host=document.getElementById('previews');host.replaceChildren();result.textContent=filesError();Array.from(photos.files).slice(0,3).forEach(f=>{const img=document.createElement('img');const url=URL.createObjectURL(f);urls.push(url);img.src=url;img.alt='找货参考图片';host.append(img);});};
document.getElementById('clear-history').onclick=()=>{if(confirm('清除当前设备的找货记录？')){records=[];save();render();}};
form.onsubmit=async e=>{e.preventDefault();if(busy)return;const error=filesError();if(error){result.textContent=error;return;}if(!form.reportValidity())return;
const data=new FormData(form);const wechat=String(data.get('微信号或微信昵称')||'').trim();if(!wechat){result.textContent='请填写微信号或微信昵称。';return;}data.set('微信号或微信昵称',wechat);
const id='F'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);data.set('需求编号',id);data.set('_subject','布丁妈｜新的找货需求 '+id);data.set('_captcha','false');data.set('_template','table');Array.from(photos.files).forEach((f,i)=>data.append(i===0?'attachment':'attachment'+(i+1),f,f.name));
const record={id,time:new Date().toLocaleString('zh-CN'),budget:String(data.get('预算')),wechat,note:String(data.get('备注')||''),images:photos.files.length,status:'提交中'};
busy=true;send.disabled=true;send.textContent='正在上传，请稍候…';result.textContent='';
record.thumbnails=(await Promise.all(Array.from(photos.files).map(thumbnail))).filter(Boolean);
const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);
try{const response=await fetch('https://formsubmit.co/ajax/yimin.zhan8@gmail.com',{method:'POST',body:data,headers:{Accept:'application/json'},signal:controller.signal});const raw=await response.text();let answer;try{answer=JSON.parse(raw);}catch(e){throw Error('提交服务返回非JSON内容（HTTP '+response.status+'），可能是验证页面或服务异常');}if(!response.ok||!(answer.success===true||answer.success==='true')){const detail=String(answer.message||answer.error||'服务未确认接收').slice(0,350);throw Error('HTTP '+response.status+'：'+detail);} 
if(/activat|confirm.*email/i.test(String(answer.message||''))){record.status='等待商家激活收件邮箱，请稍后确认';result.textContent='提交服务需要商家激活邮箱，暂未确认收件，请通过微信 collectiondemaman 联系我们。';}else{record.status='提交服务已接收';result.textContent='已收到你的找货需求！我们会帮你留意，找到合适的藏品后通过微信联系你。';form.reset();urls.forEach(URL.revokeObjectURL);urls=[];document.getElementById('previews').replaceChildren();}
}catch(e){const detail=e.name==='AbortError'?'上传超时（90秒）':e instanceof TypeError?'无法连接提交服务：可能是网络或跨域限制':String(e.message||e);record.status='提交未完成';record.error=detail;result.textContent='提交未完成：'+detail+'。请截图发给我们；需求编号：'+id;}
finally{clearTimeout(timer);records.unshift(record);if(!save())result.textContent+=' 当前浏览器无法保存历史，请截图保留需求编号。';render();busy=false;send.disabled=false;send.textContent='提交';}
};render();})();
</script>

<style>
.fav-link{position:fixed;right:12px;top:8px;z-index:100;background:white;border:1px solid #ddd;border-radius:24px;padding:9px 13px;color:#9b3049;text-decoration:none;min-height:44px}
header .bar{padding-right:100px!important}.fav-button{min-height:44px;padding:10px 14px;border:1px solid #ddd;border-radius:12px;background:white;color:#9b3049;cursor:pointer}.fav-button[aria-pressed="true"]{background:#fff0f3}.card{position:relative}.card>.fav-button{position:absolute;top:8px;right:8px;z-index:2}.fav-row{display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #eee}.fav-row img{width:72px;height:72px;object-fit:cover;border-radius:8px}.fav-row .fav-info{flex:1;min-width:0}.fav-actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.fav-actions button,.fav-actions a{padding:12px;border:1px solid #ddd;border-radius:12px;background:white;color:inherit}.fav-status{font-size:13px;color:#765}.fav-note{color:#666;font-size:14px}
@media(max-width:600px){header .bar{flex-wrap:wrap}.fav-row{flex-wrap:wrap}.fav-link{right:8px}.fav-row .fav-info{overflow-wrap:anywhere}}
.sourcing-link{position:fixed;right:100px;top:8px;z-index:100;background:#fff;border:1px solid #ddd;border-radius:24px;padding:9px 12px;min-height:44px;box-sizing:border-box;text-decoration:none;color:#333;font-size:14px}header .bar{padding-right:200px!important}@media(max-width:600px){header .bar{padding-right:192px!important}}
</style>
<a class="sourcing-link" href="/sourcing.html">帮我找货</a>
<a class="fav-link" href="/favorites.html" aria-label="查看喜欢">♡ <span id="fav-count">0</span></a>
<script>
(()=>{'use strict';
const KEY='collectionDeMaman:cn:favorites:v1', catalogue=new Map();
let saved=[], ready=false;
const note=document.createElement('p');note.className='fav-note';note.setAttribute('role','status');
function message(s){note.textContent=s;if(!note.isConnected)(document.querySelector('main,.wrap')||document.body).append(note);}
function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');saved=Array.isArray(a)?Array.from(new Map(a.filter(x=>x&&typeof x.pid==='string').map(x=>[x.pid,{pid:x.pid,title:String(x.title||x.pid),cover_thumb:String(x.cover_thumb||'')}])).values()):[];}catch(e){saved=[];message('浏览器不支持保存，喜欢记录仅在当前页面有效。');}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){message('未能保存到设备，请保持页面打开。');}paint();}
function has(pid){return saved.some(x=>x.pid===pid);}
function button(item){const b=document.createElement('button');b.type='button';b.className='fav-button';b.dataset.favoritePid=String(item.pid);b.onclick=()=>{read();if(has(String(item.pid)))saved=saved.filter(x=>x.pid!==String(item.pid));else saved.push({pid:String(item.pid),title:item.title,cover_thumb:item.cover_thumb||''});persist();};return b;}
function paint(){document.getElementById('fav-count').textContent=saved.length;document.querySelectorAll('[data-favorite-pid]').forEach(b=>{const active=has(b.dataset.favoritePid);b.textContent=active?'♥ 已喜欢':'♡ 喜欢';b.setAttribute('aria-pressed',String(active));b.setAttribute('aria-label',active?'取消喜欢':'加入喜欢');});render();}
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){read();paint();}});
// Back/forward cache restores the old JS state: reload shared favorites on return.
function refreshFavorites(){read();paint();}
window.addEventListener('pageshow',refreshFavorites);
window.addEventListener('focus',refreshFavorites);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFavorites();});

function enhance(){document.querySelectorAll('.card[data-pid]').forEach(el=>{if(el.querySelector('[data-favorite-pid]'))return;const pid=el.dataset.pid;el.append(button(catalogue.get(pid)||{pid,title:el.querySelector('.t')?.textContent||pid}));});const p=document.getElementById('pid_text');if(p&&!document.querySelector('.product-info [data-favorite-pid]'))p.closest('.product-info').querySelector('h1').after(button({pid:p.textContent.trim(),title:document.querySelector('h1').textContent}));paint();}
const host=document.getElementById('favorites-list');
function render(){if(!host)return;host.replaceChildren();if(!ready){host.textContent='正在读取在售状态…';return;}if(!saved.length){host.textContent='还没有喜欢的商品，点击商品爱心即可收藏。';return;}saved.forEach(old=>{const item=catalogue.get(old.pid),r=document.createElement('div');r.className='fav-row';const info=document.createElement('div');info.className='fav-info';const title=document.createElement(item?'a':'span');title.textContent=(item||old).title;if(item)title.href='/p/'+encodeURIComponent(item.pid)+'.html';info.append(title);const status=document.createElement('div');status.className='fav-status';const idLabel=document.createElement('span');idLabel.className='fav-id';idLabel.textContent='ID: '+old.pid+' · ';status.append(idLabel,document.createTextNode(item?'在售':'已下架或暂不可用'));info.append(status);if(item?.cover_thumb){const img=document.createElement('img');img.src='/thumb/'+encodeURIComponent(item.cover_thumb);img.alt='';img.loading='lazy';r.append(img);}r.append(info);const remove=document.createElement('button');remove.type='button';remove.className='fav-button';remove.textContent='移除';remove.onclick=()=>{read();saved=saved.filter(x=>x.pid!==old.pid);persist();};r.append(remove);host.append(r);});}
function enquiry(){if(!ready){message('请等待商品状态加载完成。');return null;}const list=saved.map(x=>catalogue.get(x.pid)).filter(Boolean);if(!list.length){message('请先收藏在售商品。');return null;}return list.map(x=>(x.enquiry_title||x.title.split(/\r?\n/)[0])+'\n'+new URL('/p/'+encodeURIComponent(x.pid)+'.html',location.origin).href).join('\n\n');}
for(const mode of ['copy']){const b=document.getElementById('fav-'+mode);if(b)b.onclick=async()=>{const text=enquiry();if(!text)return;if(mode==='copy'){try{await navigator.clipboard.writeText(text);message('咨询清单已复制。');}catch(e){const t=document.createElement('textarea');t.value=text;host.before(t);t.select();message('请从文本框手动复制咨询清单。');}}};}
read();new MutationObserver(records=>{if(records.some(r=>Array.from(r.addedNodes).some(n=>n.nodeType===1&&(n.matches?.('.card')||n.querySelector?.('.card')))))enhance();}).observe(document.body,{childList:true,subtree:true});enhance();
fetch('/favorites-catalogue-cn.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json();}).then(items=>{if(!Array.isArray(items))throw Error('Invalid catalogue');items.forEach(x=>catalogue.set(String(x.pid),x));ready=true;enhance();}).catch(()=>{if(host)host.textContent='商品状态读取失败，请刷新重试；喜欢记录仍保留。';message('暂时无法核实商品状态，请刷新后再复制咨询清单。');});
})();
</script>

</body>
